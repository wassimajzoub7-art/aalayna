<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aalayna Film</title>
<meta name="description" content="Aalayna in 45 seconds: the wait for the bill, then scan, menu, split, tip, pay and rate from the table, and the restaurant's live side.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@700&display=block" rel="stylesheet">
<style>
/* Aalayna film: one 45 s timeline in two formats (?format=portrait) and two languages (?lang=fr).
   Every frame is a pure function of t (render(t)), so the page plays live, scrubs, and renders frame-exact to video
   through tools/render-reel.js. The phone, dashboard and editor are vector rebuilds of the real screens. */
:root{--bg:#FAF6F1;--ink:#211B16;--sub:#6E635B;--line:#EAE2D8;--red:#C9414B;--petrol:#173E43;--peach:#F6C39F;
  --a-line:#E7E5E0;--a-soft:#F0EEE9;--a-ink:#171D1A;--a-sub:#68716B;--a-faint:#9AA29C;--a-green:#0F4B3A;--a-gbg:#EDF3EF;--a-gline:#D5E3DA;
  --a-amber:#8A6A1F;--a-abg:#F8F1DF;--a-aline:#EBDDB4;--a-red:#B4423A}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#view{position:fixed;inset:0}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#123236;transform-origin:0 0}
.act,.fill{position:absolute;inset:0}
.a{position:absolute;left:0;top:0;will-change:transform,opacity}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .12em;margin:0 -.02em -.12em}
.w>span{display:inline-block;transform-origin:0 100%}

/* Act 1: the wait */
#a1 .fill{background:radial-gradient(ellipse at 62% 50%,#22494E 0%,#16383C 46%,#0E2A2D 100%)}
.bokeh{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(246,195,159,.22),rgba(246,195,159,0) 70%)}
#tableBox{width:1000px;height:1000px}
#tableBox svg{position:absolute;inset:0;overflow:visible}
.cap1{font-weight:700;letter-spacing:-.045em;line-height:1.04;color:var(--bg)}
.cap1 .em{color:var(--peach)}
.pain{display:flex;align-items:center;gap:.5em;padding:.3em .8em .3em .3em;border-radius:999px;background:rgba(250,246,241,.08);border:2px solid rgba(250,246,241,.16);color:var(--bg);font-weight:600;white-space:nowrap}
.pain i{width:1.5em;height:1.5em;border-radius:50%;background:var(--red);display:grid;place-items:center;font-style:normal;color:#fff;font-weight:700}
.pain svg{width:.9em;height:.9em}
#clock{font-weight:600;letter-spacing:.08em;color:rgba(250,246,241,.8);font-variant-numeric:tabular-nums;white-space:nowrap}
#clock b{color:var(--peach);font-weight:700}

/* Act 2: the turn */
#a2 .fill{background:var(--red)}
.kl{position:absolute;overflow:hidden;padding:0 40px 24px 0;font-weight:700;line-height:1;letter-spacing:-.055em;color:var(--bg);white-space:nowrap}
.kl span{display:inline-block;transform-origin:0 100%}
#k3{color:var(--ink)}
#thesis{font-weight:500;color:var(--bg);line-height:1.3}

/* Act 3: the guest */
#a3 .fill{background:var(--bg)}
.cap{display:flex;flex-direction:column;align-items:flex-start}
.cap .lab{font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red);white-space:nowrap}
.cap .hd{font-weight:700;letter-spacing:-.045em;line-height:1.04;color:var(--ink);margin-top:.3em}
.cap .hd .em{color:var(--red)}
.cap .sb{color:var(--sub);line-height:1.34;margin-top:.75em}
.cap .hd,.cap .sb,.cap1,#thesis{text-wrap:balance}
#capB .lab{color:var(--peach)}#capB .hd{color:var(--bg)}#capB .hd .em{color:var(--peach)}#capB .sb{color:#C4D2CF}
.rline{position:absolute;height:3px;border-radius:2px;background:var(--line);transform-origin:0 50%}
.rline.on{background:var(--red)}
.node{width:18px;height:18px;border-radius:50%;border:3px solid #D9CFC2;background:var(--bg)}
.rlab{font-weight:600;color:var(--sub);white-space:nowrap}
#rdot{width:26px;height:26px;border-radius:50%;background:var(--red);box-shadow:0 0 0 8px rgba(201,65,75,.16)}

/* The phone: a 390 px wide app viewport, scaled into the screen */
#phoneLayer{perspective:2600px;pointer-events:none}
#phone{width:440px;height:888px;padding:15px;border-radius:68px;background:linear-gradient(150deg,#342b25,#14100d 60%);box-shadow:0 50px 90px rgba(33,27,22,.3),0 14px 26px rgba(33,27,22,.18),inset 0 0 0 2px #463d35,inset 0 0 0 6px #0d0b09}
#screen{position:relative;width:410px;height:858px;border-radius:53px;overflow:hidden;background:#fff}

#sbar.light{color:#fff}
#sbar svg{height:13px}
#glare{position:absolute;inset:0;border-radius:53px;z-index:13;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 32%,rgba(255,255,255,.13) 44%,rgba(255,255,255,0) 58%);background-size:220% 100%}
#app{position:absolute;left:0;top:46px;width:390px;height:772px;transform-origin:0 0;overflow:hidden;color:var(--a-ink);font-size:15px}

#sCam{background:radial-gradient(ellipse at 50% 42%,#54443a 0%,#221b17 58%,#0d0a09 100%)}

#pLang{right:118px}#pCur{right:16px}

.tabs{position:absolute;left:16px;top:112px;display:flex;gap:18px;font-size:14px;color:var(--a-sub);white-space:nowrap}

#billBtn{position:absolute;left:62px;top:700px;width:266px;height:48px;border-radius:24px;background:var(--a-green);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:600;box-shadow:0 10px 24px rgba(15,75,58,.3)}

<script>

const C = COPY[LANG];

/* ---------- Math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  inQuad: k => k * k,
  inCubic: k => k * k * k,
  outCubic: k => 1 - Math.pow(1 - k, 3),
  inOutCubic: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  inExpo: k => k === 0 ? 0 : Math.pow(2, 10 * k - 10),
  outExpo: k => k === 1 ? 1 : 1 - Math.pow(2, -10 * k),

const lira = v => 'LL ' + Math.round(v).toLocaleString('en-US');

// Position an element by its centre: x y z s sx sy r rx ry o
function T(el, o) {
  const s = o.s ?? 1;
  let tr = `translate3d(${o.x ?? 0}px,${o.y ?? 0}px,${o.z ?? 0}px) translate(-50%,-50%)`;
  if (o.rx) tr += ` rotateX(${o.rx}deg)`;
  if (o.ry) tr += ` rotateY(${o.ry}deg)`;
  if (o.r) tr += ` rotate(${o.r}deg)`;
  tr += ` scale(${(o.sx ?? 1) * s},${(o.sy ?? 1) * s})`;
  el.style.transform = tr;
  el.style.opacity = o.o ?? 1;
}
// Position by top-left corner.
const TL = (el, x, y, o = 1, extra = '') => { el.style.transform = `translate(${x}px,${y}px) ${extra}`; el.style.opacity = o; };
const show = (el, on) => { el.style.display = on ? '' : 'none'; };
const blurX = (id, v) => $(id).firstElementChild.setAttribute('stdDeviation', `${Math.min(60, Math.abs(v)).toFixed(1)} 0`);
// Words in their own masks; *…* marks emphasis.
function words(txt) {
  let em = false, out = '';
  txt.split('*').forEach((part, i) => {
    if (i) em = !em;
    part.split(/( +)/).forEach(w => { if (!w) return; out += / /.test(w) ? ' ' : `<span class="w"><span${em ? ' class="em"' : ''}>${w}</span></span>`; });

/* ---------- Build ---------- */
const stage = $('stage');

function tableSVG() {

function caption(el, key, specs, times, t, L) {

// The phone, its screens, and everything that happens on them.
function phone(t) {

  for (const [kt, ax, ay, z] of FOCUS) { const k = E.inOutCubic(p(t, kt, kt + .65)); if (t >= kt) st = { ax: lerp(st.ax, ax, k), ay: lerp(st.ay, ay, k), z: lerp(st.z, z, k) }; }
  const s = PH.s * st.z, dx = st.ax * K + 15 - 220, dy = st.ay * K + 61 - 444;
  let x = PH.x - s * dx, y = PH.y - s * dy, sc = s;
  if (P) y = Math.max(y, 612 + 444 * s);   // portrait: zooms never climb over the caption
  const up = spring(t - 10.75, 1.2, 5);
  y += lerp(H * .9, 0, clamp(up, 0, 1.2));
  let ry = lerp(34, -8, clamp(up, 0, 1.1)) / st.z + 3 * Math.sin(t * .6), rx = lerp(20, 3, clamp(up, 0, 1.1)), rz = lerp(-10, 0, clamp(up, 0, 1.1));
  // Restaurant side: small beside the dashboard, then larger beside the editor.
  const m1 = E.inOutCubic(p(t, 32.3, 32.95)), m2 = E.inOutCubic(p(t, 36.1, 36.7)), m3 = E.inOutCubic(p(t, 38.2, 38.6)) - E.inOutCubic(p(t, 39.2, 39.6));
  const A = lay({ x: 1800, y: 905, s: .4 }, { x: 882, y: 1612, s: .5 }), B = lay({ x: 1650, y: 548, s: .62 }, { x: 858, y: 1100, s: .66 });
  x = lerp(lerp(x, A.x, m1), B.x, m2); y = lerp(lerp(y, A.y, m1), B.y, m2); sc = lerp(lerp(sc, A.s, m1), B.s, m2) * (1 + .1 * m3);
  ry = lerp(ry, -14, m1); rx = lerp(rx, 4, m1); rz = lerp(rz, lay(4, 3), m1 * (1 - m2));
  phoneNow = { x, y, s: sc };
  T($('phone'), { x, y, s: sc, ry, rx, r: rz });
  $('glare').style.backgroundPosition = `${50 + ry * 3}% 0`;

  // Screens: open (fade and grow), push (slide in from the right) or back (slide in from the left).

  NAV.forEach((n, i) => { if (t >= n[0]) cur = i; });
  document.querySelectorAll('.scr').forEach(el => { el.style.display = 'none'; });
  const [ct, cid, dir] = NAV[cur], k = E.inOutCubic(p(t, ct, ct + .45)), inc = $(cid);

  if (cur > 0 && k < 1) {

    out.style.transform = dir === 0 ? '' : dir > 0 ? `translateX(${-110 * k}px)` : `translateX(${390 * k}px)`;
    out.querySelector('.dim') && (out.querySelector('.dim').style.opacity = dir > 0 ? .12 * k : 0);
    out.style.opacity = 1;
  }
  inc.style.transform = dir === 0 ? `scale(${lerp(.94, 1, k)})` : dir > 0 ? `translateX(${390 * (1 - k)}px)` : `translateX(${-110 * (1 - k)}px)`;
  inc.style.opacity = dir === 0 ? k : 1;

}

function fit() {

  stage.style.left = (capture ? 0 : (innerWidth - W * s) / 2) + 'px'; stage.style.top = (capture ? 0 : (innerHeight - H * s) / 2) + 'px';
}

}

btn.onclick = () => playing ? pause() : play(at >= DUR ? 0 : at);

addEventListener('keydown', e => { if (e.key === ' ' && e.target === document.body) { e.preventDefault(); btn.click(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pause(); });
document.fonts.ready.then(() => { render(at); bar.style.width = at / DUR * 100 + '%'; if (playing) play(at); else if (reduce) { document.body.classList.add('ended'); btn.textContent = 'Play'; } });
})();
