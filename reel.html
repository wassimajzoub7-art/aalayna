<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aalayna Film</title>
<meta name="description" content="Aalayna in 96 seconds, all at one table: four friends sit down, scan and read the menu, eat, wait for the bill, then split, tip, pay and rate, and the restaurant's live floor, closing on the 3LAYNA logo.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Amiri:wght@700&display=block" rel="stylesheet">
<style>
/* Aalayna film: one 45 s timeline in two formats (?format=portrait) and two languages (?lang=fr), set at one table.
   The table, the room and the waiter are a vector world under a camera that dives into the guest's phone and rises
   over the floor. Every frame is a pure function of t (render(t)), so the page plays live, scrubs, and renders
   frame-exact to video through tools/render-reel.js. The phone and panels are vector rebuilds of the real screens.
   As on the site: Instrument Sans for everything read (captions, labels, figures), IBM Plex Sans Arabic for the Arabic
   words, Aalayna Block (the logo's capitals) for the name only; every corner square and every shadow hard. The phone
   screens are the guest app's standard menu and keep its own faces; the restaurant's panels are the dashboard and the
   editor, which read in Instrument Sans like the film. */
@font-face{font-family:'Aalayna Block';src:url(brand/fonts/aalayna-block.woff) format('woff');font-display:block}
:root{--bg:#FAF6F1;--ink:#211B16;--sub:#6E635B;--line:#EAE2D8;--red:#C9414B;--petrol:#173E43;--peach:#F6C39F;--green:#3E8E6A;--amber:#E0A33A;
  --a-line:#E7E5E0;--a-soft:#F0EEE9;--a-ink:#171D1A;--a-sub:#68716B;--a-faint:#9AA29C;--a-green:#0F4B3A;--a-gbg:#EDF3EF;--a-gline:#D5E3DA;
  --a-amber:#8A6A1F;--a-abg:#F8F1DF;--a-aline:#EBDDB4;--a-red:#B4423A;
  --display:'Aalayna Block',monospace;--label:'Instrument Sans','IBM Plex Sans Arabic',system-ui,sans-serif;--text:'Instrument Sans','IBM Plex Sans Arabic',system-ui,sans-serif;
  --app:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif;--staff:'Instrument Sans','IBM Plex Sans Arabic',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--text);color:var(--ink);-webkit-font-smoothing:antialiased}
#view{position:fixed;inset:0}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#0E2A2D;transform-origin:0 0}
.layer{position:absolute;inset:0}
.a{position:absolute;left:0;top:0}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .12em;margin:0 -.02em -.12em}
.w>span{display:inline-block;transform-origin:0 100%}

/* The world: floor, tables, table 12 */
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world svg{position:absolute;overflow:visible}
#vig{pointer-events:none}

/* The cold open: letterboxed macro shots, cut on the beat */
#tsT,#tsB{left:0;width:100%;-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px)}
#tsT{top:0;-webkit-mask-image:linear-gradient(#000 20%,transparent);mask-image:linear-gradient(#000 20%,transparent)}
#tsB{bottom:0;top:auto;-webkit-mask-image:linear-gradient(transparent,#000 80%);mask-image:linear-gradient(transparent,#000 80%)}
#coldT{z-index:6;font-weight:600;letter-spacing:-.01em;color:#FAF6F1;text-align:center;white-space:nowrap}
#coldDot{width:56px;height:56px;background:var(--red)}
#lbT,#lbB{left:0;width:100%;background:#000;z-index:5}
#iris{background:#000}
/* Act 1: the wait */
.cap1{font-weight:600;letter-spacing:-.02em;line-height:1.04;color:var(--bg);text-wrap:balance}
.cap1 .em{color:var(--peach)}
.pain{display:flex;align-items:center;gap:.5em;padding:.3em .8em .3em .3em;background:rgba(14,42,45,.72);border:2px solid rgba(250,246,241,.18);color:var(--bg);font-weight:500;white-space:nowrap}
.pain i{width:1.5em;height:1.5em;background:var(--red);display:grid;place-items:center;font-style:normal;color:#fff;font-weight:700}
.pain svg{width:.9em;height:.9em}
#clock{font-family:var(--label);font-weight:500;letter-spacing:.02em;color:rgba(250,246,241,.8);font-variant-numeric:tabular-nums;white-space:nowrap}
#clock b{color:var(--peach);font-weight:700}

/* Act 2: the turn */
#red .fill{position:absolute;inset:0;background:var(--red)}
.kl{position:absolute;overflow:hidden;padding:0 40px 24px 0;font-weight:600;letter-spacing:-.02em;line-height:1.1;color:var(--bg);white-space:nowrap}
.kl em{font-style:normal;color:var(--bg)}
.kl span{display:inline-block;transform-origin:0 100%}
#k3{color:var(--ink);font-family:var(--display);font-weight:400;letter-spacing:0}
#thesis{font-weight:500;color:var(--bg);line-height:1.3;text-wrap:balance}

/* Captions and the journey rail, over the room */
.cap{display:flex;flex-direction:column;align-items:flex-start}
.cap .lab{font-family:var(--label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--peach);white-space:nowrap}
.cap .hd{font-weight:600;letter-spacing:-.02em;line-height:1.04;color:var(--bg);margin-top:.3em;text-wrap:balance}
.cap .hd .em{color:var(--peach)}
.cap .sb{color:#C9D6D3;line-height:1.34;margin-top:.75em;text-wrap:balance}
.rline{position:absolute;height:2px;background:rgba(250,246,241,.14);transform-origin:0 50%}
.node{width:12px;height:12px;border:2px solid rgba(250,246,241,.28);background:#10302F}
.rlab{font-family:var(--label);font-weight:500;color:rgba(250,246,241,.5);white-space:nowrap}
#rdot{width:18px;height:18px;background:var(--red);box-shadow:0 0 0 6px rgba(201,65,75,.18)}

/* The guest's phone: a 390 px wide app viewport, scaled into the screen */
#phoneLayer{perspective:2600px;pointer-events:none}
#phone{width:440px;height:888px;padding:15px;border-radius:68px;background:linear-gradient(150deg,#342b25,#14100d 60%);transform-origin:50% 50%}
#screen{position:relative;width:410px;height:858px;border-radius:53px;overflow:hidden;background:#fff}
#island{position:absolute;left:149px;top:11px;width:112px;height:32px;border-radius:16px;background:#0b0908;z-index:14}
#off{position:absolute;inset:0;background:#0a0908;z-index:12}
#sbar{position:absolute;left:0;top:0;width:410px;height:46px;z-index:11;font-family:var(--app);display:flex;align-items:center;justify-content:space-between;padding:6px 36px 0 44px;font-size:16px;font-weight:600;color:var(--a-ink)}
#sbar.light{color:#fff}
#sbar svg{height:13px}
#glare{position:absolute;inset:0;border-radius:53px;z-index:13;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,0) 32%,rgba(255,255,255,.13) 44%,rgba(255,255,255,0) 58%);background-size:220% 100%}
#app{position:absolute;left:0;top:46px;width:390px;height:772px;transform-origin:0 0;overflow:hidden;color:var(--a-ink);font-family:var(--app);font-size:15px}
.scr{position:absolute;left:0;top:0;width:390px;height:772px;background:#fff;overflow:hidden}
.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}

.cta{position:absolute;left:16px;width:358px;top:688px;height:50px;border-radius:12px;background:var(--a-green);color:#fff;display:grid;place-items:center;font-weight:600;font-size:16px}
.pw{position:absolute;left:0;right:0;top:748px;text-align:center;font-size:12px;color:var(--a-faint)}
.pw b{color:var(--a-sub)}
.pv{display:inline-flex;flex-direction:column;overflow:hidden;vertical-align:top}
.pv>*{display:block;font-style:normal;white-space:nowrap}
#sCam{background:radial-gradient(ellipse at 50% 42%,#54443a 0%,#221b17 58%,#0d0a09 100%)}
#tent{position:absolute;left:77px;top:150px;width:236px;height:300px;border-radius:20px;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.45);text-align:center}
#tent canvas{display:block;margin:20px auto 0}
#tent b{display:block;margin-top:12px;font-size:16px}

#brk{position:absolute;left:0;top:0;overflow:visible}
#scanl{position:absolute;left:92px;width:206px;height:4px;border-radius:2px;background:var(--red);box-shadow:0 0 18px 4px rgba(201,65,75,.6)}
#scanPill{position:absolute;left:65px;top:566px;width:260px;height:48px;border-radius:24px;background:#FAF6F1;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14.5px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.35)}
#scanPill i{width:12px;height:12px;border-radius:50%;background:var(--red)}
.m-title{position:absolute;left:70px;top:8px;font-size:20px;font-weight:700;line-height:24px}
.m-sub{position:absolute;left:70px;top:32px;font-size:13px;color:var(--a-sub)}
.pill{position:absolute;top:8px;height:42px;padding:0 11px;border:1.5px solid var(--a-line);border-radius:12px;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;background:#fff}
.pill .pv{height:18px;line-height:18px;align-items:flex-start}
.pill u{text-decoration:none;color:var(--a-sub);font-size:11px}
#pLang{right:118px}#pCur{right:16px}

.row .v.ar .why{left:auto;right:16px}

#fScrim{position:absolute;inset:0;background:#000;opacity:0;z-index:4}
#fSheet{position:absolute;left:0;right:0;top:772px;height:352px;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -12px 36px rgba(0,0,0,.2);z-index:5}
#fSheet .gr{position:absolute;left:175px;top:10px;width:40px;height:5px;border-radius:3px;background:#D9D6D0}

.fchips{position:absolute;left:20px;right:20px;top:114px;display:flex;flex-wrap:wrap;gap:8px}
.fc{height:38px;padding:0 13px;border:1.5px solid var(--a-line);border-radius:10px;display:flex;align-items:center;font-size:14.5px;font-weight:500;background:#fff}
.fc.on{background:var(--a-gbg);border-color:var(--a-gline);color:var(--a-green);font-weight:700}
#fBar{position:absolute;left:20px;right:20px;top:212px;height:42px;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:10px;background:var(--a-gbg);font-size:14px;color:var(--a-green);opacity:0}

#fBar u{margin-left:auto;text-decoration:none;font-weight:600}
#fSheet .disc{position:absolute;left:20px;top:266px;font-size:12.5px;color:var(--a-faint)}
#fDone{position:absolute;left:16px;right:16px;top:292px;height:50px;border-radius:12px;background:var(--a-green);color:#fff;display:grid;place-items:center;font-weight:600;font-size:16px}
.bc-ll{text-align:right;font-size:12.5px;color:var(--a-sub);margin-top:2px;font-variant-numeric:tabular-nums}
#sHome{background:#fff}
.h-hero{position:absolute;left:0;right:0;top:0;height:318px;background:#173E43;overflow:hidden}
.h-pat{position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(246,195,159,.16) 1.2px,transparent 1.6px);background-size:18px 18px}
.h-crest{position:absolute;left:0;right:0;top:92px;text-align:center;color:#FAF6F1}
.h-crest small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.2em;color:#F6C39F}
.h-crest b{display:block;font-family:'Amiri',serif;font-size:46px;line-height:60px;margin-top:8px}

.h-greet{position:absolute;left:24px;top:346px;font-family:'Amiri',serif;font-size:30px;font-weight:700}
.h-tbl{position:absolute;left:24px;top:398px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--a-green)}

.h-note{position:absolute;left:24px;right:24px;top:430px;font-size:15px;line-height:23px;color:var(--a-sub)}
#hMenu{position:absolute;left:16px;right:16px;top:600px;height:52px;border-radius:12px;background:var(--a-green);color:#fff;display:grid;place-items:center;font-weight:600;font-size:16px}
#hBill{position:absolute;left:16px;right:16px;top:664px;height:52px;border-radius:12px;border:1.5px solid var(--a-green);color:var(--a-green);display:grid;place-items:center;font-weight:600;font-size:16px;background:#fff}
.tabs{position:absolute;left:16px;top:112px;display:flex;gap:18px;font-size:14px;color:var(--a-sub);white-space:nowrap}
.tabs b{color:var(--a-ink);font-weight:600;border-bottom:2px solid var(--a-ink);padding-bottom:9px}
.hair{position:absolute;left:0;right:0;height:1px;background:var(--a-soft)}
.sec{position:absolute;left:16px;font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--a-green)}
.row{position:absolute;left:0;width:390px;height:86px;border-bottom:1px solid var(--a-soft)}
.row .v{position:absolute;inset:0;padding:12px 16px 0}

#billBtn{position:absolute;left:62px;top:700px;width:266px;height:48px;border-radius:24px;background:var(--a-green);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:600;box-shadow:0 10px 24px rgba(15,75,58,.3)}

/* ---------- Playback ---------- */
function fit() {

})();
