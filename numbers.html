<style>
  /* Sizes and colours come from the tokens in website.css. */
  .num-wrap{width:min(1040px,calc(100% - 3rem));margin-inline:auto;padding-block:2rem 4rem}
  .num-title{font-size:var(--fs-heading);letter-spacing:-.04em;line-height:1.1}

  .calc-steps li span:last-child{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--petrol)}
  .calc-steps li.final{border-top:2px solid var(--petrol)}

  .calc-steps small{display:block;color:var(--sub);font-size:var(--fs-small);margin-top:.15rem}

  .tl li.total{border-top:2px solid var(--petrol);font-weight:600}
  .proof{margin-top:1.5rem;padding:1.5rem 2rem;border:1px solid var(--line);border-radius:1.25rem;background:var(--surface)}

  .proof .actions{margin-top:1.2rem}

  @media(max-width:767px){.num-wrap{width:calc(100% - 2rem)}.result{padding:1.5rem}.result .figure{font-size:var(--fs-display)}.how,.story,.proof{padding:1.25rem}.timelines{grid-template-columns:minmax(0,1fr)}.tl li span:last-child{white-space:normal;text-align:right}.calc-steps li{grid-template-columns:1.5rem 1fr;gap:.5rem}.calc-steps li span:last-child{grid-column:2;white-space:normal}}

<script>
(function () {
  var WEEKS = 4.33, AFTER_MIN = 4, TIP_RATE = 0.09, TIP_SHARE = 0.75, REVIEW_RATE = 0.04, OPTIN = 0.20, RETURN = 0.08;
  var q = new URLSearchParams(location.search);
  var focus = (q.get('focus') || 'turns').replace(/[^a-z]/g, '');
  var ORDER = ['turns', 'tips', 'reviews', 'guests'];
  if (ORDER.indexOf(focus) < 0 && focus !== 'all') focus = 'turns';

  /* the owner's figures: one shared set, prefilled from the link */
  var FIELDS = {
    tables:  { label: 'Tables in use on a full night', def: 30, min: 1 },
    check:   { label: 'Average bill per table', hint: 'USD, food and drinks', def: 45, min: 1 },
    paid:    { label: 'Bills paid per week', hint: 'all services', def: 360, min: 1 },
    peak:    { label: 'Busy services per week', hint: 'nights you turn people away', def: 2, min: 0, max: 14 },
    sit:     { label: 'Average sitting at peak', hint: 'minutes, arrival to departure', def: 90, min: 30 },
    done:    { label: 'Done eating to out the door', hint: 'minutes, today', def: 20, min: 1 },
    tiprate: { label: 'Tip today, when guests tip', hint: '% of the bill', def: 5, min: 0, max: 30 },
    tipshare:{ label: 'Tables that tip today', hint: '%', def: 60, min: 0, max: 100 },
    reviews: { label: 'Google reviews per month today', def: 4, min: 0 },
    adoption: { label: 'Bills using Aalayna', hint: '% of eligible bills · assumption', def: 50, min: 0, max: 100 },
    capture: { label: 'Receipt contacts submitted', hint: '% of Aalayna bills · assumption', def: 20, min: 0, max: 100 },
    unique: { label: 'New, distinct contacts', hint: '% of submissions after deduplication · assumption', def: 60, min: 0, max: 100 },
    permission: { label: 'Agree to marketing', hint: '% of new contacts · separate permission', def: 50, min: 0, max: 100 },
    returnrate: { label: 'Recorded return after invitation', hint: '% of eligible contacts · not proven lift', def: 8, min: 0, max: 100 },
    fill: { label: 'Freed capacity filled', hint: '% with waiting demand and staff capacity', def: 50, min: 0, max: 100 },
    after: { label: 'Settlement with Aalayna', hint: 'minutes before change return · assumption', def: 4, min: 1, max: 60 },
    newtipshare: { label: 'Aalayna tables that tip', hint: '% · assumption', def: 75, min: 0, max: 100 },
    newtiprate: { label: 'Tip when they do', hint: '% · assumption', def: 9, min: 0, max: 100 },
    reviewrate: { label: 'Aalayna bills leaving a review', hint: '% · assumption, not a measured result', def: 4, min: 0, max: 100 }
  };
  var v = {};
  Object.keys(FIELDS).forEach(function (k) { var p = q.get(k); v[k] = AalaynaNumbers.clamp(p !== null && p !== '' ? p : FIELDS[k].def,FIELDS[k].min,FIELDS[k].max == null ? 1000000 : FIELDS[k].max,FIELDS[k].def); });
  /* Display rule: every step is computed from the figures shown on the lines above it, never from
     hidden decimals, so the arithmetic on screen can be checked by hand.
     A figure that is carried into a later step keeps two decimals below 10 and one decimal from 10 up
     (keep). If that would still move a whole figure at the end of the chain away from the full-precision
     result, carried figures keep one more decimal until it does not (settle): no headline is rounded up,
     or down, through an intermediate.
     A count that ends a chain (tables, reviews, returns) is whole, and a money line after it multiplies that
     whole count. Money that is only shown is to the cent per bill and to the dollar for totals. */
  function r1(x) { return Math.round(x * 10) / 10 + 0; }
  function r2(x) { return Math.round(x * 100) / 100 + 0; }
  var PREC = 0; /* extra decimals on carried figures; -1 means full precision, used only by settle() */
  function keep(x) { if (PREC < 0) return x; var f = Math.pow(10, (Math.abs(x) < 10 ? 2 : 1) + PREC); return Math.round(+(x * f).toFixed(6)) / f + 0; }
  function settle(o) {
    PREC = -1; var want = o.ends(o.compute()), r;
    for (PREC = 0; PREC < 4; PREC++) { r = o.compute(); if (o.ends(r) === want) break; }
    PREC = 0; return r;
  }
  function show(x) { return (x < 0 ? '\u2212' : '') + Math.abs(x).toLocaleString('en-US', { maximumFractionDigits: 6 }); }
  function int(x) { return Math.round(x).toLocaleString('en-US'); }
  function money(x, cents) { var a = Math.abs(x); return (x < 0 ? '−' : '') + '$' + (cents ? a.toFixed(2) : Math.round(a).toLocaleString('en-US')); }
  function usd(x) { return money(x, x % 1 !== 0); }
  function signed(x, fmt) { return (x < 0 ? '−' : '+') + fmt(Math.abs(x)); }

  /* ---- each outcome: which inputs, the headline, the arithmetic, the story ---- */
  var OUTCOMES = {
    turns: {
      eyebrow: 'Tables turn faster', inputs: ['done', 'tables', 'sit', 'peak', 'check', 'adoption', 'fill', 'after'],
      compute: function () {
        /* today's minutes, split across the usual steps; the change trip is the same in both flows */
        var shares = [['Catching the waiter\'s eye', .15], ['Bill printed and brought over', .15], ['The table works out who pays what', .25], ['Waiter comes back for the cash', .15], ['Waiter goes to the till', .15], ['Waiter returns with the change', .15]];
        var acc = 0, left = [];
        shares.forEach(function (x, i) { var m = i === shares.length - 1 ? Math.max(1, keep(v.done - acc)) : Math.max(1, Math.round(v.done * x[1])); acc += m; left.push([x[0], m]); });
        var change = left[left.length - 1][1], after = keep(v.after + change), saved = keep(Math.max(0, v.done - after));
        var share = keep(saved / v.sit * 100), perService = keep(v.tables * share / 100 * v.adoption / 100 * v.fill / 100);
        var month = Math.round(perService * v.peak * WEEKS);
        return { left: left, change: change, after: after, saved: saved, share: share, perService: perService, month: month, revenue: Math.round(month * v.check) };
      },
      ends: function (r) { return String(r.month); },
      headline: function (r) { return { figure: '+' + int(r.month), unit: '<b>potential extra tables a month</b> on your busy nights, worth ' + money(r.revenue) + ' at your average bill' }; },
      steps: function (r) { return [
        ['Minutes from done to out the door today', 'what you typed; the last ' + show(r.change) + ' of them are the waiter returning with the change', show(v.done) + ' min'],
        ['Bill, split and payment on the phone', 'editable scenario assumption, to test in the pilot', show(v.after) + ' min'],
        ['Waiter returns with the change and the receipt', 'the same return trip as today, counted on both sides; the trip to the till is gone', show(r.change) + ' min'],
        ['Done to out the door with Aalayna', show(v.after) + ' min + ' + show(r.change) + ' min', show(r.after) + ' min'],
        ['Minutes given back on every table', v.done > r.after ? show(v.done) + ' min − ' + show(r.after) + ' min' : 'none: with these figures Aalayna is not faster than today', show(r.saved) + ' min'],
        ['Share of a sitting that frees up', show(r.saved) + ' min ÷ ' + show(v.sit) + ' min', show(r.share) + '%'],
        ['Extra tables per busy service', show(v.tables) + ' tables × ' + show(r.share) + '% freed time × ' + show(v.adoption) + '% adoption × ' + show(v.fill) + '% filled capacity', show(r.perService)],
        ['Extra tables a month', show(r.perService) + ' × ' + show(v.peak) + ' busy services × 4.33 weeks', int(r.month), true],
        ['At your average bill', int(r.month) + ' tables × ' + usd(v.check), money(r.revenue), true]
      ]; },
      story: function (r) {
        var left = r.left.map(function (x) { return [x[0], show(x[1]) + ' min']; });
        left.push(['Done to out the door', show(v.done) + ' min']);
        return { title: 'One table, tonight, paying cash.', intro: 'A party of four finishes dinner. What happens next, today and with Aalayna. The return trip with the change is the same in both.', left: left,
                 right: [['Scan the QR, the bill is already there', '1 min'], ['Split on their phones, evenly, by item or an amount', '2 min'], ['Declare the note they are paying with, tip in one tap', '1 min'], ['Waiter returns with the change and the receipt', show(r.change) + ' min'], ['Done to out the door', show(r.after) + ' min']] };
      },
      proof: ['Share of bills settled through Aalayna, week by week.', 'Median minutes from bill opened to paid, on your own tables.', 'Table time on busy nights against the baseline you give us in week zero.'],
      note: 'Extra tables only exist on services where guests wait or are turned away. On a quiet night the minutes saved are staff time and a better exit, not sales.'
    },
    tips: {
      eyebrow: 'Servers earn more tips', inputs: ['check', 'paid', 'tiprate', 'tipshare', 'adoption', 'newtipshare', 'newtiprate'],
      compute: function () {
        /* tips as a share of the bill, so no per-bill cent rounding is carried into the month */
        var todayRate = keep(v.tiprate * v.tipshare / 100), afterRate = keep(v.newtiprate * v.newtipshare / 100), extraRate = keep(afterRate - todayRate);
        return { todayRate: todayRate, afterRate: afterRate, extraRate: extraRate,
          today: r2(v.check * todayRate / 100), after: r2(v.check * afterRate / 100), perBill: r2(v.check * extraRate / 100),
          todayMonth: Math.round(v.check * todayRate / 100 * v.paid * WEEKS), month: Math.round(v.check * extraRate / 100 * v.paid * v.adoption / 100 * WEEKS) };
      },
      ends: function (r) { return r.month + ',' + r.todayMonth; },
      headline: function (r) { return { figure: signed(r.month, money), unit: '<b>change in tips a month</b> for your servers, on top of the ' + money(r.todayMonth) + ' they collect today' }; },
      steps: function (r) { return [
        ['Share of the bill tipped today, on average', show(v.tiprate) + '% tip × ' + show(v.tipshare) + '% of tables that tip', show(r.todayRate) + '%'],
        ['Tips a month today', usd(v.check) + ' × ' + show(r.todayRate) + '% × ' + show(v.paid) + ' bills a week × 4.33 weeks', money(r.todayMonth)],
        ['Tip options at the payment step, 10% preselected', 'guests choose 5%, 10%, 15% or their own amount in one tap', ''],
        ['Tables that tip when the choice is in front of them', 'editable scenario assumption, to test in the pilot', show(v.newtipshare) + '%'],
        ['Average tip when they do', 'our working rate, with 10% preselected', show(v.newtiprate) + '%'],
        ['Share of the bill tipped with Aalayna', show(v.newtiprate) + '% tip × ' + show(v.newtipshare) + '% of tables that tip', show(r.afterRate) + '%'],
        ['Extra share of the bill in tips', show(r.afterRate) + '% − ' + show(r.todayRate) + '%', show(r.extraRate) + '%'],
        ['More per bill', usd(v.check) + ' × ' + show(r.extraRate) + '%', money(r.perBill, true)],
        ['More per month', usd(v.check) + ' × ' + show(r.extraRate) + '% × ' + show(v.paid) + ' bills a week × ' + show(v.adoption) + '% adoption × 4.33 weeks', money(r.month), true]
      ]; },
      story: function (r) { return { title: 'One bill of ' + usd(v.check) + '.', intro: 'What the server takes home from it.',
        left: [['Guests who leave a tip', show(v.tipshare) + '%'], ['When they do, they leave', show(v.tiprate) + '%'], ['Expected tip', money(r.today, true)]],
        right: [['Tip options shown at payment', '3 taps'], ['Guests who leave a tip', show(v.newtipshare) + '%'], ['When they do, they leave', show(v.newtiprate) + '%'], ['Expected tip', money(r.after, true)]] }; },
      proof: ['Digital tips per server, per week, from the first service.', 'Share of settled bills that included a tip, and the average rate.', 'Side by side with what your servers declared before the pilot.'],
      note: 'Tips go to your staff under your own policy. Aalayna records who earned what and never handles the money.'
    },
    reviews: {
      eyebrow: 'More Google reviews', inputs: ['paid', 'reviews', 'adoption', 'reviewrate'],
      compute: function () {
        var week = keep(v.paid * v.adoption / 100 * v.reviewrate / 100), base = keep(v.reviews * v.adoption / 100);
        var month = Math.round(week * WEEKS - base), total = keep(v.reviews + month);
        return { week: week, base: base, month: month, total: total, mult: v.reviews > 0 && total > 0 ? r1(total / v.reviews) : null };
      },
      ends: function (r) { return String(r.month); },
      headline: function (r) { return { figure: signed(r.month, int), unit: '<b>Google reviews a month</b>, from ' + show(v.reviews) + ' today to about ' + show(r.total) + (r.mult ? ', ' + show(r.mult) + ' times as many' : '') }; },
      steps: function (r) { return [
        ['Bills paid per week', 'what you typed', show(v.paid)],
        ['Every guest is asked to rate the visit, one tap, on the receipt screen', 'no app, no login, the rating is the last thing they see', ''],
        ['Happy guests are sent straight to your Google page', 'unhappy guests are offered a private note to you instead', ''],
        ['Tables that go on to leave a Google review', 'editable scenario assumption, to test in the pilot', show(v.reviewrate) + '%'],
        ['Reviews per week on Aalayna bills', show(v.paid) + ' bills × ' + show(v.adoption) + '% adoption × ' + show(v.reviewrate) + '%', show(r.week)],
        ['Reviews a month that already come from those bills today', show(v.reviews) + ' today × ' + show(v.adoption) + '% adoption', show(r.base)],
        ['Change in monthly reviews', show(r.week) + ' a week × 4.33 weeks − ' + show(r.base) + ' already coming', signed(r.month, int), true],
        ['Reviews per month, all in', show(v.reviews) + ' today ' + (r.month < 0 ? '− ' : '+ ') + int(Math.abs(r.month)), show(r.total), true]
      ]; },
      story: function (r) { return { title: show(v.paid) + ' tables this week.', intro: 'How many of them end up as a Google review.',
        left: [['Tables served', show(v.paid)], ['Guests who go and find your Google page', 'a few'], ['Reviews per week', show(r1(v.reviews / WEEKS))]],
        right: [['Asked to rate, one tap, after paying', 'all of them'], ['Happy ones sent to your Google page', show(v.reviewrate) + '%' + ' leave a review'], ['Unhappy ones send a private note to you', 'not to Google'], ['Reviews per week', show(r.week)]] }; },
      proof: ['Ratings left on the receipt screen, per week.', 'Google reviews per week against your count from the month before.', 'Private notes from unhappy guests, so you see what never reached Google.'],
      note: 'Reviews are written by guests in their own words. Aalayna only opens the door; it never writes or filters a public review.'
    },
    guests: {
      eyebrow: 'Guests you can invite back', inputs: ['paid', 'check', 'adoption', 'capture', 'unique', 'permission', 'returnrate'],
      compute: function () {
        /* the same chain as AalaynaNumbers.guests, rounded at each displayed step */
        var bills = keep(v.paid * v.adoption / 100), week = keep(bills * v.capture / 100), submissions = keep(week * WEEKS * 3);
        var unique = keep(submissions * v.unique / 100), quarter = keep(unique * v.permission / 100), back = Math.round(quarter * v.returnrate / 100);
        return { bills: bills, week: week, submissions: submissions, unique: unique, quarter: quarter, back: back, value: Math.round(back * v.check) };
      },
      ends: function (r) { return Math.round(r.quarter) + ',' + r.back; },
      headline: function (r) { return { figure: int(r.quarter), unit: '<b>potential new marketing contacts</b> after three months, after allowing for repeat submissions and separate permission' }; },
      steps: function (r) { return [
        ['Bills using Aalayna per week', show(v.paid) + ' bills × ' + show(v.adoption) + '% adoption', show(r.bills)],
        ['Receipt contacts submitted per week', show(r.bills) + ' Aalayna bills × ' + show(v.capture) + '% contact capture', show(r.week)],
        ['Contact submissions over three months', show(r.week) + ' a week × 4.33 weeks × 3 months', show(r.submissions)],
        ['New distinct contacts', show(r.submissions) + ' submissions × ' + show(v.unique) + '% left after removing repeat and existing contacts', show(r.unique)],
        ['Eligible for restaurant offers', show(r.unique) + ' distinct contacts × ' + show(v.permission) + '% separate marketing permission', show(r.quarter), true],
        ['Recorded returns after one invitation', show(r.quarter) + ' eligible contacts × ' + show(v.returnrate) + '% assumed return rate', int(r.back)],
        ['Associated bill revenue in this scenario', int(r.back) + ' returning contacts × ' + usd(v.check) + ' average bill, one bill each; not profit or proven incremental revenue', money(r.value), true]
      ]; },
      story: function (r) { return { title: show(v.paid) + ' bills this week.', intro: 'Build a permission-based audience without counting the same person every time they visit.',
        left: [['Bills served', show(v.paid)], ['Existing contact list', 'use your current records'], ['Marketing permission', 'check separately from receipt delivery']],
        right: [['Bills using Aalayna', show(v.adoption) + '%'], ['New distinct contacts after a quarter', int(r.unique)], ['Can receive offers', int(r.quarter)], ['Recorded returns in this scenario', int(r.back)]] }; },
      proof: ['Contact submissions, unique new contacts and marketing permissions, measured separately.', 'Delivered invitations and subsequently recorded visits.', 'A comparison group and sufficient observation time before claiming incremental revenue.'],
      note: 'Contact capture does not imply marketing permission. These adjustable assumptions are scenarios, not validated forecasts. Associated bill revenue assumes one bill per returning contact and excludes profit, discounts and campaign costs.'
    }
  };

  var main = document.getElementById('main');
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function pills(active) {
    var nav = el('nav', 'pills'); nav.setAttribute('aria-label', 'Outcomes');
    [['turns', 'Faster tables'], ['tips', 'Tips'], ['reviews', 'Reviews'], ['guests', 'Guests who return'], ['all', 'Everything']].forEach(function (p) {
      var a = el('a', p[0] === active ? 'on' : '', p[1]); a.href = '?focus=' + p[0];
      a.addEventListener('click', function (e) { e.preventDefault(); var s = new URLSearchParams(); s.set('focus', p[0]); Object.keys(v).forEach(function (k) { s.set(k, v[k]); }); location.href = '?' + s.toString(); });
      nav.appendChild(a);
    });
    return nav;
  }
  function section(key, showPills) {
    var o = OUTCOMES[key], wrap = el('section', 'section'); wrap.dataset.key = key;
    var res = el('div', 'result');
    res.appendChild(el('p', 'eyebrow', o.eyebrow));
    var fig = el('div', 'figure'), unit = el('p', 'unit'), star = el('p', 'star', '* Illustrative scenario using your adoption and outcome assumptions. Not a forecast or guaranteed result.');
    res.appendChild(fig); res.appendChild(unit); res.appendChild(star);
    res.appendChild(el('p', 'edit-h', 'Your figures. <span>Tap any box and type your own; the number above updates as you type.</span>'));
    var inputs = el('div', 'inputs');
    o.inputs.forEach(function (k) {
      var f = FIELDS[k], lab = el('label', '', f.label + '<span class="hint">' + (f.hint || '') + '</span>');
      var inp = el('input'); inp.type = 'number'; inp.min = f.min; if (f.max != null) inp.max = f.max; inp.value = v[k]; inp.setAttribute('aria-label', f.label);
      inp.addEventListener('input', function () { var x = parseFloat(inp.value); if (isFinite(x)) { v[k] = AalaynaNumbers.clamp(x,f.min,f.max == null ? 1000000 : f.max,f.def); document.querySelectorAll('input[data-key="' + k + '"]').forEach(function (i) { if (i !== inp) i.value = x; }); paintAll(); } });
      inp.dataset.key = k; lab.appendChild(inp); inputs.appendChild(lab);
    });
    res.appendChild(inputs); wrap.appendChild(res);
    var how = el('div', 'how'); how.appendChild(el('h2', '', 'How we get to this number')); var ol = el('ol', 'calc-steps'); how.appendChild(ol); wrap.appendChild(how);
    var st = el('div', 'story'); wrap.appendChild(st);
    var proof = el('div', 'proof'); proof.appendChild(el('h2', '', 'How the pilot proves it, on your own tables'));
    var ul = el('ul'); o.proof.forEach(function (t) { ul.appendChild(el('li', '', t)); }); proof.appendChild(ul);
    proof.appendChild(el('p', '', 'Two months, no fee. In week seven we put the measured number next to the one above. You decide with your own figure. To check this number first, go through it with us on a call.'));
    var act = el('div', 'actions'); var a = el('a', 'btn', 'Book a 15-min call'); a.href = 'book.html'; a.dataset.track = 'booking_click'; a.dataset.placement = 'numbers_' + key; act.appendChild(a); proof.appendChild(act);
    wrap.appendChild(proof);
    wrap.appendChild(el('p', 'sources', o.note + ' All outcome assumptions are illustrative and should be replaced by measured pilot results.'));
    if (showPills) { var other = el('div', 'other'); other.appendChild(el('p', '', 'Look at another outcome with the same figures:')); other.appendChild(pills(key)); wrap.appendChild(other); }
    wrap._parts = { fig: fig, unit: unit, ol: ol, st: st };
    return wrap;
  }
  function paintSection(wrap) {
    var key = wrap.dataset.key, o = OUTCOMES[key], r = settle(o), h = o.headline(r), p = wrap._parts;
    p.fig.innerHTML = h.figure + '<sup>*</sup>'; p.unit.innerHTML = h.unit;
    p.ol.innerHTML = '';
    o.steps(r).forEach(function (s) {
      var li = el('li', s[3] ? 'final' : ''); li.appendChild(el('span', '', s[0] + (s[1] ? '<small>' + s[1] + '</small>' : ''))); li.appendChild(el('span', '', s[2])); p.ol.appendChild(li);
    });
    var s = o.story(r); p.st.innerHTML = '';
    p.st.appendChild(el('h2', '', s.title)); p.st.appendChild(el('p', '', s.intro));
    var tl = el('div', 'timelines');
    [['Today', s.left], ['With Aalayna', s.right]].forEach(function (side) {
      var d = el('div', 'tl'); d.appendChild(el('h3', '', side[0])); var ol = el('ol');
      side[1].forEach(function (row, i) { var li = el('li', i === side[1].length - 1 ? 'total' : ''); li.appendChild(el('span', '', row[0])); li.appendChild(el('span', '', row[1])); ol.appendChild(li); });
      d.appendChild(ol); tl.appendChild(d);
    });
    p.st.appendChild(tl);
  }
  var sections = [];
  if (focus === 'all') {
    var head = el('div', '', '<p class="eyebrow">Everything, with the same figures</p><h1 class="num-title">Four numbers, one restaurant.</h1>');
    head.appendChild(pills('all')); main.appendChild(head);
    ORDER.forEach(function (k) { var s = section(k, false); main.appendChild(s); sections.push(s); });
  } else {
    var s1 = section(focus, true); main.appendChild(s1); sections.push(s1);
  }
  function paintAll() { sections.forEach(paintSection); }
  paintAll();
})();
</script>
