<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aalayna: the numbers</title>
<meta name="description" content="Type your restaurant's figures and see the result for one outcome: faster tables, more tips, more reviews, or guests who come back. The arithmetic is shown under every number.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="website.css?v=4">
<style>
  .num-wrap{width:min(1040px,calc(100% - 3rem));margin-inline:auto;padding-block:2rem 4rem}
  .result{background:var(--petrol);color:#fff;border-radius:1.25rem;padding:2rem 2.25rem}
  .result .eyebrow{color:var(--peach)}
  .result .figure{font-size:clamp(3rem,8vw,5.2rem);font-weight:700;letter-spacing:-.05em;line-height:1;margin-top:.4rem;font-variant-numeric:tabular-nums}
  .result .figure sup{font-size:.35em;vertical-align:top;color:var(--peach);margin-left:.1em}
  .result .unit{font-size:1.15rem;color:#D7E3E2;margin-top:.5rem}
  .result .unit b{color:#fff;font-weight:600}
  .result .star{font-size:.875rem;color:#B9C7C4;margin-top:1rem}
  .edit-h{margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid #ffffff2a;font-size:.9rem;color:#fff;font-weight:600}
  .edit-h span{font-weight:400;color:#B9C7C4}
  .inputs{display:flex;flex-wrap:wrap;gap:.75rem 1.25rem;margin-top:.75rem;align-items:flex-end}
  .inputs label{font-size:.8125rem;color:#D7E3E2;display:flex;flex-direction:column;justify-content:flex-end;gap:.3rem;min-width:9rem;flex:1}
  .inputs .hint{font-size:.75rem;color:#B9C7C4;font-weight:400;min-height:1.1em}
  .inputs input{font:inherit;font-size:1.1rem;font-weight:600;padding:.55rem .75rem;border:0;border-radius:.6rem;background:#fff;color:var(--ink);width:100%;cursor:text;margin-top:auto}
  .inputs input:focus{outline:none;box-shadow:0 0 0 3px var(--peach)}
  .how{margin-top:1.5rem;background:var(--surface);border:1px solid var(--line);border-radius:1.25rem;padding:1.75rem 2rem}
  .how h2{font-size:1.15rem}
  .calc-steps{list-style:none;margin:1rem 0 0;padding:0;counter-reset:s;display:block}
  .calc-steps li{display:grid;grid-template-columns:2rem 1fr auto;gap:1rem;align-items:baseline;padding:.75rem 0;border-top:1px solid var(--line);font-size:.95rem}
  .calc-steps li::before{counter-increment:s;content:counter(s);font-weight:600;color:var(--brand)}
  .calc-steps li span:last-child{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--petrol)}
  .calc-steps li.final{border-top:2px solid var(--petrol)}
  .calc-steps li.final span:last-child{font-size:1.15rem}
  .calc-steps small{display:block;color:var(--sub);font-size:.8125rem;margin-top:.15rem}
  .story{margin-top:1.5rem;border:1px solid var(--line);border-radius:1.25rem;padding:1.75rem 2rem;background:var(--surface)}
  .story h2{font-size:1.15rem}.story p{margin-top:.4rem}
  .timelines{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:1rem}
  .tl h3{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:.5rem}
  .tl ol{list-style:none;padding:0;margin:0}
  .tl li{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;border-top:1px solid var(--line);font-size:.9rem}
  .tl li span:last-child{white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums;color:var(--petrol)}
  .tl li.total{border-top:2px solid var(--petrol);font-weight:600}
  .proof{margin-top:1.5rem;padding:1.5rem 2rem;border:1px solid var(--line);border-radius:1.25rem;background:var(--surface)}
  .proof h2{font-size:1.15rem}.proof ul{margin:.6rem 0 0;padding-left:1.2rem;font-size:.9rem;color:var(--sub)}.proof li{margin:.3rem 0}
  .proof .actions{margin-top:1.2rem}
  .other{margin-top:2rem}.other p{font-size:.9rem;color:var(--sub)}
  .pills{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
  .pills a{text-decoration:none;font-size:.875rem;font-weight:500;padding:.45rem .9rem;border:1px solid var(--line);border-radius:2rem;background:var(--surface);color:var(--ink)}
  .pills a.on{background:var(--petrol);border-color:var(--petrol);color:#fff}
  .sources{margin-top:1.5rem;font-size:.8125rem;color:var(--sub);line-height:1.6}
  .section+.section{margin-top:3rem;padding-top:3rem;border-top:1px solid var(--line)}
  @media(max-width:720px){.result{padding:1.5rem}.how,.story,.proof{padding:1.25rem}.timelines{grid-template-columns:1fr}.calc-steps li{grid-template-columns:1.5rem 1fr;gap:.5rem}.calc-steps li span:last-child{grid-column:2;white-space:normal}}
  @media print{.site-nav,.other,.proof .actions{display:none}.result{color:#000;background:#fff;border:1px solid #999}.result .eyebrow,.result .unit,.result .unit b,.result .star,.result .figure sup,.inputs label,.inputs .hint{color:#000}.inputs input{color:#000;background:#fff;border-color:#999}}
</style>
</head>
<body>
<header class="site-nav">
  <nav class="wrap nav-in" aria-label="Main navigation">
    <a class="logo" href="index.html" aria-label="Aalayna home">aalay<b>na</b></a>
    <div class="nav-links"><a href="index.html">Home</a><a href="book.html">Book a conversation</a></div>
    <button class="btn compact" type="button" onclick="window.print()">Print</button>
  </nav>
</header>
<main class="num-wrap" id="main"></main>
<footer class="wrap footer"><a class="logo" href="index.html">aalay<b>na</b></a><p>© 2026 Aalayna · For restaurants in Lebanon</p><a data-track="whatsapp_click" data-placement="numbers_footer" href="https://wa.me/33665745963?text=Hi%2C%20I%27d%20like%20to%20go%20through%20the%20numbers%20for%20my%20restaurant">Contact us on WhatsApp</a></footer>
<script src="analytics-config.js" defer></script>
<script src="analytics.js" defer></script>
<script>
(function () {
  var WEEKS = 4.33, AFTER_MIN = 4, TIP_RATE = 0.09, TIP_SHARE = 0.75, REVIEW_RATE = 0.04, OPTIN = 0.20, RETURN = 0.08;
  var q = new URLSearchParams(location.search);
  var focus = (q.get('focus') || 'turns').replace(/[^a-z]/g, '');
  var ORDER = ['turns', 'tips', 'reviews', 'guests'];
  if (ORDER.indexOf(focus) < 0 && focus !== 'all') focus = 'turns';

  /* the owner's figures: one shared set, prefilled from the link */
  var FIELDS = {
    tables:  { label: 'Tables in use on a full night', def: 30, min: 1 },
    check:   { label: 'Average bill per table', hint: 'USD, food and drinks', def: 45, min: 1 },
    paid:    { label: 'Bills paid per week', hint: 'all services', def: 360, min: 1 },
    peak:    { label: 'Busy services per week', hint: 'nights you turn people away', def: 2, min: 0, max: 14 },
    sit:     { label: 'Average sitting at peak', hint: 'minutes, arrival to departure', def: 90, min: 30 },
    done:    { label: 'Done eating to out the door', hint: 'minutes, today', def: 18, min: 1 },
    tiprate: { label: 'Tip today, when guests tip', hint: '% of the bill', def: 5, min: 0, max: 30 },
    tipshare:{ label: 'Tables that tip today', hint: '%', def: 60, min: 0, max: 100 },
    reviews: { label: 'Google reviews per month today', def: 4, min: 0 }
  };
  var v = {};
  Object.keys(FIELDS).forEach(function (k) { var p = q.get(k); v[k] = (p !== null && p !== '' && isFinite(+p)) ? +p : FIELDS[k].def; });
  function usd(x) { return '$' + Math.round(x).toLocaleString('en-US'); }
  function int(x) { return Math.round(x).toLocaleString('en-US'); }
  function pct(x) { return Math.round(x * 100) + '%'; }

  /* ---- each outcome: which inputs, the headline, the arithmetic, the story ---- */
  var OUTCOMES = {
    turns: {
      eyebrow: 'Tables turn faster', inputs: ['done', 'tables', 'sit', 'peak', 'check'],
      compute: function () {
        /* today's minutes, split across the usual steps; the change trip is the same in both flows */
        var shares = [['Catching the waiter\'s eye', .22], ['Bill printed and brought over', .17], ['The table works out who pays what', .28], ['Waiter comes back for the cash', .17], ['Waiter goes to the till and returns with the change', .16]];
        var acc = 0, left = [];
        shares.forEach(function (x, i) { var m = i === shares.length - 1 ? Math.max(1, v.done - acc) : Math.max(1, Math.round(v.done * x[1])); acc += m; left.push([x[0], m]); });
        var change = left[left.length - 1][1], after = AFTER_MIN + change;
        var saved = Math.max(0, v.done - after), perService = v.tables * saved / v.sit, month = perService * v.peak * WEEKS;
        return { left: left, change: change, after: after, saved: saved, perService: perService, month: month, revenue: month * v.check };
      },
      headline: function (r) { return { figure: '+' + int(r.month), unit: '<b>extra tables a month</b> on your busy nights, worth ' + usd(r.revenue) + ' at your average bill' }; },
      steps: function (r) { return [
        ['Minutes from done to out the door today', 'what you typed; the last ' + r.change + ' of them are the waiter bringing the change', v.done + ' min'],
        ['Bill, split and payment on the phone', 'measured at 3 to 5 minutes by pay-at-table platforms abroad; we use 4', AFTER_MIN + ' min'],
        ['Waiter brings the change with the receipt', 'the same trip as today, counted on both sides', r.change + ' min'],
        ['Done to out the door with Aalayna', AFTER_MIN + ' plus ' + r.change, r.after + ' min'],
        ['Minutes given back on every table', v.done + ' minus ' + r.after, r.saved + ' min'],
        ['Share of a sitting that frees up', r.saved + ' of ' + v.sit + ' minutes', pct(r.saved / v.sit)],
        ['Extra tables per busy service', v.tables + ' tables times ' + pct(r.saved / v.sit), r.perService.toFixed(1)],
        ['Extra tables a month', r.perService.toFixed(1) + ' times ' + v.peak + ' busy services times 4.33 weeks', int(r.month), true],
        ['At your average bill', int(r.month) + ' times ' + usd(v.check), usd(r.revenue), true]
      ]; },
      story: function (r) {
        var left = r.left.map(function (x) { return [x[0], x[1] + ' min']; });
        left.push(['Done to out the door', v.done + ' min']);
        return { title: 'One table, tonight, paying cash.', intro: 'A party of four finishes dinner. What happens next, today and with Aalayna. The change trip is the same in both.', left: left,
                 right: [['Scan the QR, the bill is already there', '1 min'], ['Split on their phones, evenly, by item or an amount', '2 min'], ['Declare the note they are paying with, tip in one tap', '1 min'], ['Waiter brings the change with the receipt, one trip', r.change + ' min'], ['Done to out the door', r.after + ' min']] };
      },
      proof: ['Share of bills settled through Aalayna, week by week.', 'Median minutes from bill opened to paid, on your own tables.', 'Table time on busy nights against the baseline you give us in week zero.'],
      note: 'Extra tables only exist on services where guests wait or are turned away. On a quiet night the minutes saved are staff time and a better exit, not sales.'
    },
    tips: {
      eyebrow: 'Servers earn more tips', inputs: ['check', 'paid', 'tiprate', 'tipshare'],
      compute: function () {
        var today = v.check * (v.tiprate / 100) * (v.tipshare / 100), after = v.check * TIP_RATE * TIP_SHARE;
        var perBill = Math.max(0, after - today);
        return { today: today, after: after, perBill: perBill, month: perBill * v.paid * WEEKS, todayMonth: today * v.paid * WEEKS };
      },
      headline: function (r) { return { figure: '+' + usd(r.month), unit: '<b>more in tips a month</b> for your servers, on top of the ' + usd(r.todayMonth) + ' they collect today' }; },
      steps: function (r) { return [
        ['Expected tip on one bill today', usd(v.check) + ' times ' + v.tiprate + '% times ' + v.tipshare + '% of tables that tip', '$' + r.today.toFixed(2)],
        ['Tip options at the payment step, 10% preselected', 'guests choose 5%, 10%, 15% or their own amount in one tap', ''],
        ['Tables that tip when the choice is in front of them', 'our working rate; platforms abroad report two to three times more tips', pct(TIP_SHARE)],
        ['Average tip when they do', 'our working rate, with 10% preselected', pct(TIP_RATE)],
        ['Expected tip on one bill with Aalayna', usd(v.check) + ' times ' + pct(TIP_RATE) + ' times ' + pct(TIP_SHARE), '$' + r.after.toFixed(2)],
        ['More per bill', '$' + r.after.toFixed(2) + ' minus $' + r.today.toFixed(2), '$' + r.perBill.toFixed(2)],
        ['More per month', '$' + r.perBill.toFixed(2) + ' times ' + int(v.paid) + ' bills times 4.33 weeks', usd(r.month), true]
      ]; },
      story: function (r) { return { title: 'One bill of ' + usd(v.check) + '.', intro: 'What the server takes home from it.',
        left: [['Guests who leave a tip', v.tipshare + '%'], ['When they do, they leave', v.tiprate + '%'], ['Expected tip', '$' + r.today.toFixed(2)]],
        right: [['Tip options shown at payment', '3 taps'], ['Guests who leave a tip', pct(TIP_SHARE)], ['When they do, they leave', pct(TIP_RATE)], ['Expected tip', '$' + r.after.toFixed(2)]] }; },
      proof: ['Digital tips per server, per week, from the first service.', 'Share of settled bills that included a tip, and the average rate.', 'Side by side with what your servers declared before the pilot.'],
      note: 'Tips go to your staff under your own policy. Aalayna records who earned what and never handles the money.'
    },
    reviews: {
      eyebrow: 'More Google reviews', inputs: ['paid', 'reviews'],
      compute: function () { var week = v.paid * REVIEW_RATE, month = week * WEEKS; return { week: week, month: month, total: month + v.reviews, mult: v.reviews > 0 ? (month + v.reviews) / v.reviews : null }; },
      headline: function (r) { return { figure: '+' + int(r.month), unit: '<b>Google reviews a month</b>, from ' + int(v.reviews) + ' today to about ' + int(r.total) + (r.mult ? ', ' + r.mult.toFixed(1) + ' times as many' : '') }; },
      steps: function (r) { return [
        ['Bills paid per week', 'what you typed', int(v.paid)],
        ['Every guest is asked to rate the visit, one tap, on the receipt screen', 'no app, no login, the rating is the last thing they see', ''],
        ['Happy guests are sent straight to your Google page', 'unhappy guests are offered a private note to you instead', ''],
        ['Tables that go on to leave a Google review', 'our working rate; platforms abroad report five times more reviews after adding the prompt', pct(REVIEW_RATE)],
        ['New reviews per week', int(v.paid) + ' times ' + pct(REVIEW_RATE), r.week.toFixed(1)],
        ['New reviews per month', r.week.toFixed(1) + ' times 4.33 weeks', int(r.month), true],
        ['Reviews per month, all in', int(v.reviews) + ' today plus ' + int(r.month), int(r.total), true]
      ]; },
      story: function (r) { return { title: int(v.paid) + ' tables this week.', intro: 'How many of them end up as a Google review.',
        left: [['Tables served', int(v.paid)], ['Guests who go and find your Google page', 'a few'], ['Reviews per week', (v.reviews / WEEKS).toFixed(1)]],
        right: [['Asked to rate, one tap, after paying', 'all of them'], ['Happy ones sent to your Google page', pct(REVIEW_RATE) + ' leave a review'], ['Unhappy ones send a private note to you', 'not to Google'], ['Reviews per week', r.week.toFixed(1)]] }; },
      proof: ['Ratings left on the receipt screen, per week.', 'Google reviews per week against your count from the month before.', 'Private notes from unhappy guests, so you see what never reached Google.'],
      note: 'Reviews are written by guests in their own words. Aalayna only opens the door; it never writes or filters a public review.'
    },
    guests: {
      eyebrow: 'Guests who come back', inputs: ['paid', 'check'],
      compute: function () { var week = v.paid * OPTIN, month = week * WEEKS, quarter = month * 3, back = quarter * RETURN; return { week: week, month: month, quarter: quarter, back: back, value: back * v.check }; },
      headline: function (r) { return { figure: int(r.quarter), unit: '<b>guests on your own list</b> after three months, each linked to what they spent and when they last came' }; },
      steps: function (r) { return [
        ['Bills paid per week', 'what you typed', int(v.paid)],
        ['At the receipt, guests can leave a number or email, and separately agree to your offers', 'two separate choices, both optional, recorded with the wording they saw', ''],
        ['Tables that leave a contact', 'our working rate for a receipt asked at the moment of payment', pct(OPTIN)],
        ['Contacts per week', int(v.paid) + ' times ' + pct(OPTIN), int(r.week)],
        ['Contacts per month', int(r.week) + ' times 4.33 weeks', int(r.month)],
        ['On your list after three months', int(r.month) + ' times 3', int(r.quarter), true],
        ['Tables that come back from one invitation', int(r.quarter) + ' times ' + pct(RETURN) + ', the share of a list that returns when invited', int(r.back)],
        ['Worth, at your average bill', int(r.back) + ' times ' + usd(v.check), usd(r.value), true]
      ]; },
      story: function (r) { return { title: int(v.paid) + ' tables this week.', intro: 'How many of them you could invite back.',
        left: [['Tables served', int(v.paid)], ['Guests whose number or email you have', 'the ones you know by face'], ['Ways to reach them before Ramadan', 'Instagram, to whoever follows']],
        right: [['Offered a receipt and, separately, your offers', 'all of them'], ['One in five says yes', int(r.week) + ' a week'], ['On your list after a quarter', int(r.quarter)], ['Back from one invitation', int(r.back) + ' tables']] }; },
      proof: ['Receipt and offer sign-ups per paid bill.', 'The list, with each guest\'s visits and spend, in your dashboard.', 'From month two: how many first-month guests came back within 30 days.'],
      note: 'The list is yours. Aalayna never shares one restaurant\'s guests with another and never uses them for its own marketing.'
    }
  };

  var main = document.getElementById('main');
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function pills(active) {
    var nav = el('nav', 'pills'); nav.setAttribute('aria-label', 'Outcomes');
    [['turns', 'Faster tables'], ['tips', 'Tips'], ['reviews', 'Reviews'], ['guests', 'Guests who return'], ['all', 'Everything']].forEach(function (p) {
      var a = el('a', p[0] === active ? 'on' : '', p[1]); a.href = '?focus=' + p[0];
      a.addEventListener('click', function (e) { e.preventDefault(); var s = new URLSearchParams(); s.set('focus', p[0]); Object.keys(v).forEach(function (k) { s.set(k, v[k]); }); location.href = '?' + s.toString(); });
      nav.appendChild(a);
    });
    return nav;
  }
  function section(key, showPills) {
    var o = OUTCOMES[key], wrap = el('section', 'section'); wrap.dataset.key = key;
    var res = el('div', 'result');
    res.appendChild(el('p', 'eyebrow', o.eyebrow));
    var fig = el('div', 'figure'), unit = el('p', 'unit'), star = el('p', 'star', '* Assuming every bill at your restaurant is settled through Aalayna. Fewer bills, proportionally fewer.');
    res.appendChild(fig); res.appendChild(unit); res.appendChild(star);
    res.appendChild(el('p', 'edit-h', 'Your figures. <span>Tap any box and type your own; the number above updates as you type.</span>'));
    var inputs = el('div', 'inputs');
    o.inputs.forEach(function (k) {
      var f = FIELDS[k], lab = el('label', '', f.label + '<span class="hint">' + (f.hint || '') + '</span>');
      var inp = el('input'); inp.type = 'number'; inp.min = f.min; if (f.max != null) inp.max = f.max; inp.value = v[k]; inp.setAttribute('aria-label', f.label);
      inp.addEventListener('input', function () { var x = parseFloat(inp.value); if (isFinite(x)) { v[k] = x; document.querySelectorAll('input[data-key="' + k + '"]').forEach(function (i) { if (i !== inp) i.value = x; }); paintAll(); } });
      inp.dataset.key = k; lab.appendChild(inp); inputs.appendChild(lab);
    });
    res.appendChild(inputs); wrap.appendChild(res);
    var how = el('div', 'how'); how.appendChild(el('h2', '', 'How we get to this number')); var ol = el('ol', 'calc-steps'); how.appendChild(ol); wrap.appendChild(how);
    var st = el('div', 'story'); wrap.appendChild(st);
    var proof = el('div', 'proof'); proof.appendChild(el('h2', '', 'How the pilot proves it, on your own tables'));
    var ul = el('ul'); o.proof.forEach(function (t) { ul.appendChild(el('li', '', t)); }); proof.appendChild(ul);
    proof.appendChild(el('p', '', 'Two months, no fee. In week seven we put the measured number next to the one above. You decide with your own figure.'));
    var act = el('div', 'actions'); var a = el('a', 'btn', 'Check this number on a call'); a.href = 'book.html'; a.dataset.track = 'booking_click'; a.dataset.placement = 'numbers_' + key; act.appendChild(a); proof.appendChild(act);
    wrap.appendChild(proof);
    wrap.appendChild(el('p', 'sources', o.note + ' Rates marked "our working rate" are Aalayna\'s estimates, shown so you can challenge them; "platforms abroad" refers to figures published by leading pay-at-table platforms in Europe, Asia and the Gulf, not to Lebanese data.'));
    if (showPills) { var other = el('div', 'other'); other.appendChild(el('p', '', 'Look at another outcome with the same figures:')); other.appendChild(pills(key)); wrap.appendChild(other); }
    wrap._parts = { fig: fig, unit: unit, ol: ol, st: st };
    return wrap;
  }
  function paintSection(wrap) {
    var key = wrap.dataset.key, o = OUTCOMES[key], r = o.compute(), h = o.headline(r), p = wrap._parts;
    p.fig.innerHTML = h.figure + '<sup>*</sup>'; p.unit.innerHTML = h.unit;
    p.ol.innerHTML = '';
    o.steps(r).forEach(function (s) {
      var li = el('li', s[3] ? 'final' : ''); li.appendChild(el('span', '', s[0] + (s[1] ? '<small>' + s[1] + '</small>' : ''))); li.appendChild(el('span', '', s[2])); p.ol.appendChild(li);
    });
    var s = o.story(r); p.st.innerHTML = '';
    p.st.appendChild(el('h2', '', s.title)); p.st.appendChild(el('p', '', s.intro));
    var tl = el('div', 'timelines');
    [['Today', s.left], ['With Aalayna', s.right]].forEach(function (side) {
      var d = el('div', 'tl'); d.appendChild(el('h3', '', side[0])); var ol = el('ol');
      side[1].forEach(function (row, i) { var li = el('li', i === side[1].length - 1 ? 'total' : ''); li.appendChild(el('span', '', row[0])); li.appendChild(el('span', '', row[1])); ol.appendChild(li); });
      d.appendChild(ol); tl.appendChild(d);
    });
    p.st.appendChild(tl);
  }
  var sections = [];
  if (focus === 'all') {
    var head = el('div', '', '<p class="eyebrow">Everything, with the same figures</p><h1 style="font-size:2rem;letter-spacing:-.04em;line-height:1.1">Four numbers, one restaurant.</h1>');
    head.appendChild(pills('all')); main.appendChild(head);
    ORDER.forEach(function (k) { var s = section(k, false); main.appendChild(s); sections.push(s); });
  } else {
    var s1 = section(focus, true); main.appendChild(s1); sections.push(s1);
  }
  function paintAll() { sections.forEach(paintSection); }
  paintAll();
})();
</script>
